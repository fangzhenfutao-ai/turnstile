paths:
  /api/v1/organization/directory:
    get:
      tags:
      - Organization
      summary: Get Organization Directory
      operationId: get_organization_directory_api_v1_organization_directory_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/OrganizationDirectory
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
